# Gera o .AppImage e o .deb.
#  - Em todo push e pull request: monta os dois e deixa para baixar em "Artifacts".
#  - Ao enviar uma tag vX.Y.Z (ex.: v1.0.0): monta e publica um Release com os dois arquivos.
#    A tag tem que ser igual ao __version__ do linux-music-player.py.
name: Pacotes

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pacotes:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Versão
        run: |
          VERSAO="$(python3 packaging/versao.py)"
          echo "VERSAO=$VERSAO" >> "$GITHUB_ENV"
          echo "Versão: $VERSAO"
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF_NAME#v}" != "$VERSAO" ]]; then
            echo "::error::A tag $GITHUB_REF_NAME não bate com o __version__ ($VERSAO) do linux-music-player.py"
            exit 1
          fi

      - name: Conferir o código
        run: python3 -m py_compile linux-music-player.py

      - name: AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: packaging/build-appimage.sh

      - name: .deb
        env:
          MANTENEDOR: "${{ github.repository_owner }} <${{ github.repository_owner }}@users.noreply.github.com>"
          SITE: "${{ github.server_url }}/${{ github.repository }}"
        run: packaging/build-deb.sh

      - name: Testar o AppImage
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libpulse0 libasound2t64 >/dev/null
          chmod +x dist/*.AppImage
          APPIMAGE_EXTRACT_AND_RUN=1 dist/Linux-Music-Player-*-x86_64.AppImage --versao
          cd "$RUNNER_TEMP" && "$GITHUB_WORKSPACE"/dist/Linux-Music-Player-*-x86_64.AppImage --appimage-extract >/dev/null
          QT_QPA_PLATFORM=offscreen squashfs-root/opt/python3.12/bin/python3.12 -s -E -c "
          from PyQt6.QtWidgets import QApplication
          from PyQt6 import QtMultimedia, QtSvg, QtDBus
          import mutagen
          app = QApplication([])
          print('Qt', QtMultimedia.QMediaPlayer().isAvailable() and 'com som' or 'SEM SOM')"

      - name: Somas de verificação
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: linux-music-player-${{ env.VERSAO }}
          path: dist/*

      - name: Publicar o Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Linux Music Player ${{ env.VERSAO }}
          body_path: NOTAS-DA-VERSAO.md
          files: dist/*
